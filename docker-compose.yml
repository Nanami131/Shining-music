x-backend-environment: &backend-environment
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_DATA_REDIS_HOST: redis
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: guest
  SPRING_RABBITMQ_PASSWORD: guest
  SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
  MINIO_ENDPOINT: http://minio:9000
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

x-backend-service: &backend-service
  image: shining-backend:local
  pull_policy: never
  restart: unless-stopped
  environment: *backend-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    nacos:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    container_name: shining-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      - ./docker-data/init-sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: shining-redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shining-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio
    container_name: shining-minio
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - ./docker-data/minio:/data
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  elasticsearch:
    build: ./docker/elasticsearch
    image: shining-elasticsearch:8.11.1-ik
    container_name: shining-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./docker-data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: shining-sentinel
    ports:
      - "8858:8858"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"

  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: shining-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: password
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      NACOS_AUTH_ENABLE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  user-service:
    <<: *backend-service
    container_name: shining-user-service
    command: ["/app/user-service.jar"]
    environment:
      <<: *backend-environment
      SERVER_PORT: "8081"
      SPRING_CONFIG_IMPORT: "nacos:user-service.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:common.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:secret.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shining-user?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 5s
      retries: 30

  music-service:
    <<: *backend-service
    container_name: shining-music-service
    command: ["/app/music-service.jar"]
    environment:
      <<: *backend-environment
      SERVER_PORT: "8082"
      SPRING_CONFIG_IMPORT: "nacos:music-service.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:common.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:secret.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shining-music?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 5s
      timeout: 5s
      retries: 30

  community-service:
    <<: *backend-service
    container_name: shining-community-service
    command: ["/app/community-service.jar"]
    environment:
      <<: *backend-environment
      SERVER_PORT: "8083"
      SPRING_CONFIG_IMPORT: "nacos:community-service.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:common.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:secret.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shining-community?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 5s
      timeout: 5s
      retries: 30

  statistics-service:
    <<: *backend-service
    container_name: shining-statistics-service
    command: ["/app/statistics-service.jar"]
    environment:
      <<: *backend-environment
      SERVER_PORT: "8084"
      SPRING_CONFIG_IMPORT: "nacos:statistics-service.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:common.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:secret.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shining-statistics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8084'"]
      interval: 5s
      timeout: 5s
      retries: 30

  recommend-service:
    <<: *backend-service
    container_name: shining-recommend-service
    command: ["/app/recommend-service.jar"]
    environment:
      <<: *backend-environment
      SERVER_PORT: "8085"
      SPRING_CONFIG_IMPORT: "nacos:recommend-service.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:common.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:secret.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shining-music?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8085'"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway-service:
    <<: *backend-service
    container_name: shining-gateway-service
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["/app/gateway-service.jar"]
    environment:
      <<: *backend-environment
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "nacos:gateway-service.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:common.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining,nacos:secret.yaml?serverAddr=nacos:8848&namespace=Shining&group=Shining"
    depends_on:
      user-service:
        condition: service_healthy
      music-service:
        condition: service_healthy
      community-service:
        condition: service_healthy
      statistics-service:
        condition: service_healthy
      recommend-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    image: shining-frontend:local
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: shining-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  dnsproxy:
    image: adguard/dnsproxy:latest
    container_name: shining-dnsproxy
    restart: unless-stopped
    command:
      - --listen=0.0.0.0
      - --port=53
      - --upstream=https://cloudflare-dns.com/dns-query
      - --bootstrap=127.0.0.11:53
      - --upstream=[//]127.0.0.11:53
      - --cache
    networks:
      default:
      tunnel-dns:
        ipv4_address: 172.29.53.53

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shining-cloudflared
    restart: unless-stopped
    dns:
      - 172.29.53.53
    command:
      - tunnel
      - --no-autoupdate
      - --protocol=http2
      - --edge-ip-version=4
      - --url=http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
      dnsproxy:
        condition: service_started
    networks:
      - default
      - tunnel-dns

networks:
  tunnel-dns:
    ipam:
      config:
        - subnet: 172.29.53.0/24
