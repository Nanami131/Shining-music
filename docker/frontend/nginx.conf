map $http_x_request_id $shining_request_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default $request_id;
}

log_format shining_access 'request_id=$shining_request_id method=$request_method uri=$uri '
                          'status=$status total=$request_time upstream_addr=$upstream_addr '
                          'upstream_connect=$upstream_connect_time upstream_header=$upstream_header_time '
                          'upstream_response=$upstream_response_time cf_ray=$http_cf_ray remote_addr=$remote_addr';

server {
    listen 8080;
    server_name _;
    client_max_body_size 8m;

    access_log /dev/stdout shining_access;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $shining_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $shining_request_id;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "http://localhost" always;
        add_header X-Request-Id $shining_request_id always;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        add_header X-Request-Id $shining_request_id always;
        try_files $uri $uri/ /index.html;
    }
}
